name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # e2e is the sole guard for two real-browser couplings unit tests can't
      # cover: the Ariakit capture-phase navigation seam (the ArrowDown
      # double-move class of bug) and the virtualization<->activedescendant
      # bridge — both stay green in jsdom even when they regress in a browser.
      # Do not weaken this gate. Playwright starts Storybook itself (see
      # playwright.config).
      - run: bunx playwright install --with-deps chromium webkit
      - run: bun run e2e
