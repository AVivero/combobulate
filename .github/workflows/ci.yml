name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      # e2e is the ONLY guard for the synthetic-pointer jump-key coupling
      # (unit tests stay green even if aria-activedescendant regresses), so it
      # must run in CI. Playwright starts Storybook itself (see playwright.config).
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e
